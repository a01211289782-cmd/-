name: PFAS文献追踪

on:
  workflow_dispatch:      # 保留手动触发按钮，方便测试
  schedule:
    - cron: '0 1 * * *'   # 每天 UTC 01:00 自动运行，对应北京时间上午 9:00

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install requests

      - name: 运行文献追踪脚本
        env:
          EMAIL_ENABLED: "true"
          SMTP_SERVER: "smtp.qq.com"
          SMTP_PORT: "465"
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          CROSSREF_MAILTO: ${{ secrets.SENDER_EMAIL }}
          # NCBI_API_KEY 可选：去 NCBI 官网免费申请后填入，可把 PubMed 限速从 3次/秒提到 10次/秒
          # NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python pfas_journal_tracker.py

      - name: 提交历史记录
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add pfas_history.json
          git diff --staged --quiet || git commit -m "更新文献追踪历史记录 [skip ci]"
          git push
        continue-on-error: true
